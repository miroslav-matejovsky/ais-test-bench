# Architecture rules checked by `task arch-lint`. This file is the source of
# truth for package responsibilities and allowed dependencies. Every Go package
# belongs to exactly one component. Standard library imports are always allowed.
version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "vendor"
  - ".tmp"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  go-nmea: { in: "github.com/adrianmo/go-nmea" }

components:
  # Executables.
  cmd-ais-testbench: { in: cmd/ais-testbench } # combined process: flags, logger, signals, listener, testbench.Serve
  cmd-simulator: { in: cmd/simulator } # standalone simulator process: simulator.Serve
  cmd-display: { in: cmd/display } # standalone display process: display.Serve

  # Public API.
  simulation: { in: simulation } # deterministic engine: fleet, AIS, virtual clock, stations and reception
  simulator: { in: simulator } # owned runtime, serialized commands, local source, HTTP API and manager
  simulatorapi: { in: simulatorapi } # wire DTOs, source requests and error categories
  display: { in: display } # source interface, HTTP source, shared validation and AIS projection, display API
  ui: { in: ui } # URL configuration, components, standalone pages, and embedded assets
  testbench: { in: testbench } # facade: one bench below a base path, host embedding, and standalone serving

  # Internal application support.
  simdriver: { in: internal/simdriver } # pacing, serialized commands, clock seam and demo stations
  ais: { in: internal/ais } # AIS type 1 encode and decode, NMEA validation
  ui-assets: { in: ui/internal/assets } # embedded templates, CSS, JavaScript modules, Leaflet, and htmx
  urlpath: { in: internal/urlpath } # canonical public base path validation
  httpserver: { in: internal/httpserver } # shared HTTP server settings, supervision, and bounded shutdown
  cli: { in: internal/cli } # shared listen address validation
  logtest: { in: internal/logtest } # test-only in-memory slog handler

  # Browser check fixtures.
  ui-host-fixture: { in: ui/testdata/host } # host page embedding two benches for host-browser.mjs

deps:
  cmd-ais-testbench:
    mayDependOn: [testbench, simulator, cli, urlpath]
  cmd-simulator:
    mayDependOn: [simulator, cli, urlpath]
  cmd-display:
    mayDependOn: [display, cli, urlpath]

  simulation:
    mayDependOn: [ais]

  testbench:
    mayDependOn: [simulation, simulator, display, ui, httpserver, urlpath]
  simulator:
    mayDependOn: [simulation, simdriver, simulatorapi, ui, httpserver, urlpath]
  simdriver:
    mayDependOn: [simulation]
  display:
    mayDependOn: [ais, simulatorapi, ui, httpserver, urlpath]
  ui:
    mayDependOn: [ui-assets, urlpath]
  ui-host-fixture:
    mayDependOn: [simulator, display, ui]
  ais:
    canUse: [go-nmea]
