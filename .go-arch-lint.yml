# Architecture rules checked by `task arch-lint`. This file is the source of
# truth for package responsibilities and allowed dependencies. Every Go package
# belongs to exactly one component. Standard library imports are always allowed.
version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "vendor"
  - ".tmp"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  go-nmea: { in: "github.com/adrianmo/go-nmea" }

components:
  # Executables.
  cmd-ais-test-bench: { in: cmd/ais-test-bench } # combined simulator and display process
  cmd-simulator: { in: cmd/simulator }           # standalone simulator process
  cmd-display: { in: cmd/display }               # standalone display process

  # Public API.
  simulation: { in: simulation } # engine: fleet, movement, AIS encoding, virtual clock, bounded history

  # Running application.
  app: { in: internal/app }                   # combined composition: one engine, public and private API listeners, display
  simulator: { in: internal/simulator }       # simulator HTTP API, manager routes, engine and HTTP lifecycle
  simulation-driver: { in: internal/simulation } # real-time driver: pacing, serialized count and speed commands
  simulatorapi: { in: internal/simulatorapi } # JSON wire types and simulator API contract
  display: { in: internal/display }           # simulator HTTP client, NMEA projection, display API, lifecycle
  ais: { in: internal/ais }                   # AIS type 1 encode and decode, NMEA validation
  ui: { in: internal/ui }                     # stateless HTML pages with component-specific navigation
  ui-assets: { in: internal/ui/assets }       # embedded templates, CSS, JavaScript, and htmx
  httpserver: { in: internal/httpserver }     # shared HTTP server settings and bounded shutdown
  cli: { in: internal/cli }                   # shared listen address validation

  # Design scaffolding, not used by the running application.
  ais-domain: { in: internal/ais/domain }
  ais-application: { in: internal/ais/application }
  ais-infrastructure: { in: internal/ais/infrastructure }
  simulation-domain: { in: internal/simulation/domain }
  simulation-application: { in: internal/simulation/application }
  simulation-infrastructure: { in: internal/simulation/infrastructure }
  targets-domain: { in: internal/targets/domain }
  targets-application: { in: internal/targets/application }
  targets-infrastructure: { in: internal/targets/infrastructure }
  management-service: { in: internal/management/service }
  visualization-service: { in: internal/visualization/service }
  networking: { in: internal/networking/** }

deps:
  cmd-ais-test-bench:
    mayDependOn: [app, cli]
  cmd-simulator:
    mayDependOn: [simulator, cli]
  cmd-display:
    mayDependOn: [display, cli]

  simulation:
    mayDependOn: [ais]

  app:
    mayDependOn: [simulation, simulation-driver, simulator, display, ui, httpserver]
  simulator:
    mayDependOn: [simulation, simulation-driver, simulatorapi, ui, httpserver]
  simulation-driver:
    mayDependOn: [simulation]
  display:
    mayDependOn: [ais, simulatorapi, ui, httpserver]
  ui:
    mayDependOn: [ui-assets]
  ais:
    canUse: [go-nmea]

  ais-application:
    mayDependOn: [ais-domain]
  simulation-application:
    mayDependOn: [simulation-domain, targets-domain]
  targets-application:
    mayDependOn: [targets-domain]
  management-service:
    mayDependOn: [simulation-domain, targets-domain]
  visualization-service:
    mayDependOn: [targets-domain]
