# Architecture rules checked by `task arch-lint`. This file is the source of
# truth for package responsibilities and allowed dependencies. Every Go package
# belongs to exactly one component. Standard library imports are always allowed.
version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: true

exclude:
  - "vendor"
  - ".tmp"
  - ".test-results"

excludeFiles:
  - "^.*_test\\.go$"

vendors:
  go-nmea: { in: "github.com/adrianmo/go-nmea" }

components:
  # Executables.
  cmd-ais-testbench: { in: cmd/ais-testbench } # combined simulator and display process
  cmd-simulator: { in: cmd/simulator } # standalone simulator process
  cmd-display: { in: cmd/display } # standalone display process

  # Public API.
  simulation: { in: simulation } # engine: fleet, movement, AIS encoding, virtual clock, bounded history, stations, reception, observations

  # Running application.
  app: { in: internal/app } # combined composition: one engine, public and private API listeners, display
  simulator: { in: internal/simulator } # simulator HTTP API, manager routes, engine and HTTP lifecycle
  simdriver: { in: internal/simdriver } # real-time driver: pacing, serialized count, speed, and station commands, demo stations
  simulatorapi: { in: internal/simulatorapi } # JSON wire types and simulator API contract
  display: { in: internal/display } # simulator HTTP client, NMEA projection, display API, lifecycle
  ais: { in: internal/ais } # AIS type 1 encode and decode, NMEA validation
  ui: { in: internal/ui } # stateless HTML pages with component-specific navigation
  ui-assets: { in: internal/ui/assets } # embedded templates, CSS, JavaScript, and htmx
  httpserver: { in: internal/httpserver } # shared HTTP server settings and bounded shutdown
  cli: { in: internal/cli } # shared listen address validation

deps:
  cmd-ais-testbench:
    mayDependOn: [app, cli]
  cmd-simulator:
    mayDependOn: [simulator, cli]
  cmd-display:
    mayDependOn: [display, cli]

  simulation:
    mayDependOn: [ais]

  app:
    mayDependOn: [simulation, simdriver, simulator, display, ui, httpserver]
  simulator:
    mayDependOn: [simulation, simdriver, simulatorapi, ui, httpserver]
  simdriver:
    mayDependOn: [simulation]
  display:
    mayDependOn: [ais, simulatorapi, ui, httpserver]
  ui:
    mayDependOn: [ui-assets]
  ais:
    canUse: [go-nmea]
